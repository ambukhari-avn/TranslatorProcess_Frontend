<div class="screen blue-bg">
  <span class="glyph glyph-ya" aria-hidden="true">Я</span>
  <span class="glyph glyph-a" aria-hidden="true">A</span>

  <div class="stack">
    <section class="card">
      <img class="logo" src="slovo-pulse-icon.svg" alt="" width="64" height="64" />
      <h1>Slovo Pulse</h1>
      <p class="lead">Translate English documents into Russian.</p>

      @if (error(); as message) {
        <p class="error" role="alert">{{ message }}</p>
      }

      <button type="button" class="microsoft" [disabled]="busy()" (click)="signIn()">
        <svg viewBox="0 0 21 21" width="21" height="21" aria-hidden="true">
          <rect x="1" y="1" width="9" height="9" fill="#f25022" />
          <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
          <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
        </svg>
        {{ busy() ? 'Opening Microsoft…' : 'Continue with Microsoft' }}
      </button>
    </section>
  </div>
</div>
